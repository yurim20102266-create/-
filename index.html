<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>짤·카드 스튜디오</h1>
    <p>사진에 문구를 더해서 나만의 카드를 만들어보세요.</p>
  </header>

  <main>
    <section class="controls" aria-label="카드 편집">
      <h2>카드 꾸미기</h2>

      <label for="imageInput">이미지 선택 (PNG·JPEG, 최대 10MB)</label>
      <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg"
      >
      <button type="button" id="removeImageBtn">이미지 지우기</button>

      <label for="textInput">카드 문구</label>
      <textarea
        id="textInput"
        rows="4"
        maxlength="200"
        placeholder="문구를 입력하세요"
      >오늘도 나만의 속도로</textarea>

      <label for="ratioSelect">화면 비율</label>
      <select id="ratioSelect">
        <option value="square">정사각형 (1:1)</option>
        <option value="portrait">세로형 (4:5)</option>
        <option value="landscape">가로형 (16:9)</option>
      </select>

      <label for="fontSizeInput">글자 크기</label>
      <input
        type="range"
        id="fontSizeInput"
        min="20"
        max="100"
        value="56"
      >

      <label for="textColorInput">글자 색</label>
      <input type="color" id="textColorInput" value="#ffffff">

      <label for="bgColorInput">배경 색</label>
      <input type="color" id="bgColorInput" value="#6750a4">

      <label for="textPositionSelect">문구 위치</label>
      <select id="textPositionSelect">
        <option value="top">위쪽</option>
        <option value="center" selected>가운데</option>
        <option value="bottom">아래쪽</option>
      </select>

      <h2>파일 내려받기</h2>
      <button type="button" id="downloadPngBtn">PNG 다운로드</button>
      <button type="button" id="downloadJpegBtn">JPEG 다운로드</button>

      <h2>내 템플릿</h2>

      <label for="templateNameInput">템플릿 이름</label>
      <input
        type="text"
        id="templateNameInput"
        maxlength="40"
        placeholder="예: 응원 카드"
      >
      <button type="button" id="saveTemplateBtn">새 템플릿 저장</button>

      <label for="templateSelect">저장한 템플릿</label>
      <select id="templateSelect">
        <option value="">템플릿을 선택하세요</option>
      </select>

      <div class="template-actions">
        <button type="button" id="loadTemplateBtn">불러오기</button>
        <button type="button" id="updateTemplateBtn">수정 저장</button>
        <button type="button" id="deleteTemplateBtn">삭제</button>
      </div>

      <p id="status" role="status" aria-live="polite">
        이미지를 선택하거나 문구를 입력해 주세요.
      </p>
    </section>

    <section class="preview" aria-label="카드 미리보기">
      <h2>미리보기</h2>
      <canvas id="cardCanvas" width="1080" height="1080">
        카드 미리보기를 표시하려면 캔버스를 지원하는 브라우저가 필요합니다.
      </canvas>
      <p>사진은 비율에 맞춰 중앙을 기준으로 잘립니다.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
