<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 서울 기온</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header><p class="label">TODAY'S REAL DATA</p><h1>오늘의 서울 기온</h1><p>실제 기온을 기록하고 어제와 비교합니다.</p></header>
    <section class="weather-card">
      <div id="statusBadge" class="badge">조회 전</div><p class="city">서울특별시</p>
      <div class="temperature"><strong id="temperature">--</strong><span>°C</span></div>
      <p id="change">어제 대비: 기록이 더 필요합니다.</p><button id="loadBtn">현재 기온 조회</button>
    </section>
    <section class="info-card">
      <h2>데이터 정보</h2>
      <p>출처: <a id="sourceLink" href="https://open-meteo.com/" target="_blank">Open-Meteo</a></p>
      <p>원천 관측 시각: <span id="sourceTime">--</span></p><p>조회 시각: <span id="fetchedTime">--</span></p>
      <p>기준 시간대: <strong>Asia/Seoul</strong></p>
    </section>
    <section class="test-card">
      <h2>외부 실패 합성 시험</h2>
      <div class="buttons"><button data-error="slow">느린 응답</button><button data-error="denied">접근 거절</button><button data-error="limit">호출 제한</button><button data-error="offline">오프라인</button><button data-error="format">형식 변경</button></div>
      <p id="errorMessage">시험할 실패 종류를 선택하세요.</p><button id="retryBtn" class="retry" hidden>다시 시도</button>
    </section>
    <section class="history-card"><h2>날짜별 기록</h2><div id="history">아직 저장된 기록이 없습니다.</div></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
